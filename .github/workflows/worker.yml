# The Backup Console worker, on GitHub Actions (free: public repositories have unlimited minutes,
# private ones 2,000 a month). The console on Vercel starts this when someone needs the worker;
# it runs backups, restores and Cloudflare / R2 / S3 calls, and stops itself after 20 idle minutes
# (never during a backup or an open restore). It can also be started by hand: Actions › Console
# worker › Run workflow.
#
# Repository secrets (Settings › Secrets and variables › Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY   the same values as on Vercel
#   REDIS_URL                                                    optional
# Repository variable (same page, Variables tab), optional:
#   TRAFFIC_GQL_BUDGET   traffic-analytics GraphQL queries per 5 minutes per Cloudflare token (default 240)
name: Console worker

on:
  workflow_dispatch:

# One worker at a time: a new run waits until the one before it has finished (it is never cancelled:
# that would cut off a running backup or restore). A worker on old code, or close to the time limit,
# stops by itself once nothing runs, and the waiting run takes over.
concurrency:
  group: console-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    # GitHub stops a job after 6 hours; the worker stops itself (when not busy) before that. From
    # CONSOLE_WORKER_ACCEPT_MINUTES on it starts no new backups or restore applies (an hour before
    # this limit, so one that is running can finish) and stops as soon as nothing runs.
    timeout-minutes: 355
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      # Optional: the same value as on Vercel (see README, environment variables). Empty = derived from the vault key.
      RELAY_SIGNING_KEY: ${{ secrets.RELAY_SIGNING_KEY }}
      CONSOLE_ROLE: worker
      CONSOLE_WORKER_ID: github-actions
      CONSOLE_WORKER_IDLE_MINUTES: '20'
      CONSOLE_WORKER_MAX_MINUTES: '330'
      CONSOLE_WORKER_ACCEPT_MINUTES: '295'
      CONSOLE_DATA_DIR: ${{ github.workspace }}/.worker-data
      NEXT_TELEMETRY_DISABLED: '1'
      # Optional repository variable: traffic-analytics GraphQL queries per 5 minutes per token (default 240).
      TRAFFIC_GQL_BUDGET: ${{ vars.TRAFFIC_GQL_BUDGET }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check the secrets
        run: |
          # When this run started (ms): the worker's time limits count from here, not from when it is built.
          echo "CONSOLE_WORKER_JOB_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"
          for name in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set (Settings › Secrets and variables › Actions)"; exit 1; fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The build cache and the downloaded Terraform / cf-terraforming, kept between runs.
      - name: Restore the cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .worker-data/tools
          key: worker-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            worker-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            worker-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the console
        run: npm run build

      - name: Run the worker
        run: node scripts/worker.mjs
